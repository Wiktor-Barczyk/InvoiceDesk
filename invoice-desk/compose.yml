name: invoice-desk
services:
  app:
    build: .
    ports: ["127.0.0.1:8001:8000"]
    env_file: .env
    environment:
      DOCUMENT_STORAGE: /data/files
      APP_DEMO: "0"
      DEMO_SEED: "0"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["invoice_files:/data/files"]
    restart: unless-stopped
volumes:
  invoice_files:
